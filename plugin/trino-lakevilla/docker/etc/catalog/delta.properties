# Trino's own Delta Lake connector on the same warehouse: an independent Delta
# implementation to check the interoperability of LakeVilla's tables
# (test_lakevilla.py registers LakeVilla tables with delta.system.register_table)
connector.name=delta_lake
hive.metastore=file
hive.metastore.catalog.dir=s3://warehouse/trino-delta-metastore
delta.register-table-procedure.enabled=true
delta.enable-non-concurrent-writes=true
fs.native-s3.enabled=true
s3.endpoint=http://minio:9000
s3.region=us-east-1
s3.path-style-access=true
s3.aws-access-key=admin
s3.aws-secret-key=password
