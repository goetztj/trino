connector.name=lakevilla
# LakeVilla configuration: object store, global log paths, protocol settings
# (docker-compose.yml: environment variable LAKEVILLA_CONFIG, default lvconfig.conf;
# lvconfig-snapshot.conf: ISOLATION=snapshot)
lakevilla.config-path=/etc/trino/lakevilla/${ENV:LAKEVILLA_CONFIG}
# levels of LakeVilla's protocols: 01 = LV[Write], 2 = LV[Read], 012 = LV[Hybrid]
# (docker-compose.yml: environment variable LAKEVILLA_LEVELS, default 01)
lakevilla.levels=${ENV:LAKEVILLA_LEVELS}
# schema s = s3://<BUCKET>/wh/s.db/, table t of schema default = s3://<BUCKET>/wh/t/
lakevilla.warehouse=wh/
