# LakeVilla configuration of the Trino connector with snapshot isolation
# (lvconfig.conf with ISOLATION=snapshot; used by hermitage.sh)
HOST=minio:9000
USER=admin
PASSWD=password
AWSREGION=us-east-1
BUCKET=warehouse
PathToGlobalLog=wh/_global/log.txt
PathToGlobalTmpLog=wh/_global/log.txt.tmp
LOGTHREADS=1

# protocol settings (defaults shown)
ISOLATION=snapshot
#MARKER_LEASE_MS=30000
#MARKER_GRACE_MS=100
#MAX_REDOS=3
# level 2 with other engines on the same tables (here: the catalog delta):
# commits of other engines join the snapshot, and the global log is advanced
# over them (otherwise LV[Read] neither sees them nor commits after them)
GLOBAL_LOG_REPAIR=1
#GLOBAL_LOG_REPAIR_AFTER=3
GLOBAL_LOG_CHECK_AT_BEGIN=1
#CHECKPOINTS=1
#CHECKPOINT_INTERVAL=0
